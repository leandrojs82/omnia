<!doctype html>
<html lang="pt-BR" data-tema="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmnIA — Canivete Suíço Digital</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1c2430;
  --borda: #2a3441; --texto: #e6edf3; --texto-fraco: #8b949e;
  --acento: #22d3ee; --acento-2: #a78bfa;
  --ok: #4ade80; --erro: #f87171;
  --overlay: rgba(0, 0, 0, .5);
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --r: 10px;
  --btn-texto: #06222a;
}
[data-tema="light"] {
  --bg: #f6f8fa; --surface: #ffffff; --surface-2: #eef2f6;
  --borda: #d6dee6; --texto: #1f2933; --texto-fraco: #5b6b7c;
  --acento: #0891b2; --acento-2: #7c3aed;
  --ok: #15803d; --erro: #b91c1c;
  --overlay: rgba(15, 23, 32, .35);
  --btn-texto: #f6f8fa;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--texto);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  overflow-x: hidden;
}
header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--borda);
}
.logo { font-weight: 700; letter-spacing: -.4px; white-space: nowrap; }
.logo span { color: var(--acento); }
#busca {
  flex: 1; max-width: 520px; height: 36px; padding: 0 12px;
  background: var(--bg); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r); outline: none;
}
#busca:focus { border-color: var(--acento); }
.icone-btn {
  height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r);
}
.icone-btn:hover { border-color: var(--acento); }
#btn-menu { display: none; }

.wrap { display: flex; align-items: flex-start; }
#sidebar {
  position: sticky; top: 58px; flex: 0 0 260px; width: 260px;
  height: calc(100vh - 58px); overflow-y: auto; padding: 12px;
  background: var(--surface); border-right: 1px solid var(--borda);
}
#main { flex: 1; min-width: 0; padding: 24px; max-width: 900px; }

.cat > button {
  display: flex; justify-content: space-between; width: 100%; padding: 8px 10px;
  cursor: pointer; text-align: left; font-size: 13px; font-weight: 600;
  color: var(--texto-fraco); background: none; border: 0; border-radius: 8px;
}
.cat > button:hover { background: var(--surface-2); color: var(--texto); }
.cat ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 10px; }
.cat[data-aberta="nao"] ul { display: none; }
.cat a {
  display: block; padding: 6px 10px; border-radius: 8px;
  color: var(--texto); text-decoration: none; font-size: 14px;
}
.cat a:hover { background: var(--surface-2); }
.cat a[data-ativa="sim"] { background: var(--surface-2); color: var(--acento); }
.vazia { padding: 6px 10px; font-size: 13px; color: var(--texto-fraco); font-style: italic; }

.campo { margin-bottom: 14px; }
.campo label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--texto-fraco); }
.campo input, .campo textarea, .campo select {
  width: 100%; padding: 9px 11px; font: inherit;
  background: var(--surface); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r); outline: none;
}
.campo textarea { min-height: 130px; resize: vertical; font-family: var(--mono); font-size: 13px; }
.campo input:focus, .campo textarea:focus, .campo select:focus { border-color: var(--acento); }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.linha > .campo { flex: 1 1 160px; margin-bottom: 14px; }
.btn {
  padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  border: 1px solid transparent; border-radius: var(--r);
  background: var(--acento); color: var(--btn-texto);
}
.btn:hover { filter: brightness(1.1); }
.btn.secundaria { background: var(--surface-2); color: var(--texto); border-color: var(--borda); }
.saida {
  position: relative; margin-top: 16px; padding: 14px; min-height: 46px;
  background: var(--surface); border: 1px solid var(--borda); border-radius: var(--r);
  font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word;
  overflow-x: auto;
}
.saida .copiar {
  position: absolute; top: 8px; right: 8px; display: none;
  padding: 4px 9px; font-size: 12px; cursor: pointer;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--borda); border-radius: 7px;
}
.saida[data-tem="sim"] .copiar { display: block; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  padding: 10px 18px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--acento); border-radius: var(--r);
}
#toast[data-ver="sim"] { opacity: 1; }

.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.grade-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.card, .card-cat {
  display: block; padding: 12px 14px; text-decoration: none; color: var(--texto);
  background: var(--surface); border: 1px solid var(--borda); border-radius: var(--r);
}
.card:hover, .card-cat:hover { border-color: var(--acento); }
.card span, .card-cat span { display: block; margin-top: 3px; font-size: 12px; color: var(--texto-fraco); }
.card-cat .ic { font-size: 20px; }

#overlay { display: none; }
@media (max-width: 767px) {
  #btn-menu { display: block; }
  #main { padding: 16px; }
  #sidebar {
    position: fixed; top: 58px; left: 0; z-index: 25;
    transform: translateX(-100%); transition: transform .2s;
  }
  #sidebar[data-aberta="sim"] { transform: none; }
  #overlay[data-aberta="sim"] {
    display: block; position: fixed; inset: 58px 0 0; z-index: 20;
    background: var(--overlay);
  }
}
</style>
</head>
<body>
<header>
  <button class="icone-btn" id="btn-menu" aria-label="Menu">☰</button>
  <div class="logo">Omn<span>IA</span></div>
  <input id="busca" type="search" placeholder="Buscar ferramenta…  (Ctrl+K)" autocomplete="off">
  <button class="icone-btn" id="btn-tema" aria-label="Alternar tema">🌙</button>
</header>
<div class="wrap">
  <nav id="sidebar"><div id="lista-cats"></div></nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
"use strict";
const OmnIA = { lib: {} };
const lib = OmnIA.lib;

/* ---------- lib ---------- */
lib.normalizar = s => (s == null ? "" : String(s)).toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

lib.buscar = (termo, tools) => {
  const q = lib.normalizar(termo).trim();
  if (!q) return tools.slice();
  return tools.filter(t =>
    lib.normalizar(t.nome + " " + t.desc + " " + (t.tags || []).join(" ")).includes(q)
  );
};

lib.inverter = s => [...(s || "")].reverse().join("");

lib.caixa = (s, modo) => {
  s = s || "";
  switch (modo) {
    case "maiuscula": return s.toUpperCase();
    case "minuscula": return s.toLowerCase();
    case "titulo": return s.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
    case "frase": return s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\S)/g, (m, a, b) => a + b.toUpperCase());
    case "alternada": return [...s].map((c, i) => i % 2 ? c.toLowerCase() : c.toUpperCase()).join("");
    default: return s;
  }
};

lib.removerDuplicadas = (s, ignorarCaixa = false) => {
  const vistos = new Set();
  return (s || "").split("\n").filter(l => {
    const k = ignorarCaixa ? l.toLowerCase() : l;
    if (vistos.has(k)) return false;
    vistos.add(k); return true;
  }).join("\n");
};

lib.ordenar = (s, decrescente = false) => {
  const ls = (s || "").split("\n").sort((a, b) => a.localeCompare(b, "pt-BR"));
  return (decrescente ? ls.reverse() : ls).join("\n");
};

lib.substituir = (s, busca, troca, op = {}) => {
  if (!busca) return s || "";
  const flags = "g" + (op.sensivel ? "" : "i");
  const padrao = op.regex ? busca : busca.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return (s || "").replace(new RegExp(padrao, flags), troca);
};

lib.contarTexto = s => {
  s = s || "";
  return {
    caracteres: s.length,
    semEspacos: s.replace(/\s/g, "").length,
    palavras: s.trim() ? s.trim().split(/\s+/).length : 0,
    linhas: s === "" ? 0 : s.split("\n").length,
    paragrafos: s.trim() ? s.trim().split(/\n\s*\n/).length : 0
  };
};

lib.embaralhar = itens => {
  const a = itens.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

lib.sortear = (itens, n) => lib.embaralhar(itens).slice(0, Math.min(n, itens.length));

lib.gerarSenha = (op = {}) => {
  const tam = op.tamanho || 16;
  let alfabeto = "";
  if (op.maiusculas) alfabeto += "ABCDEFGHJKLMNPQRSTUVWXYZ";
  if (op.minusculas) alfabeto += "abcdefghijkmnopqrstuvwxyz";
  if (op.numeros)    alfabeto += "23456789";
  if (op.simbolos)   alfabeto += "!@#$%&*-_=+?";
  if (!alfabeto) return "";
  const bytes = new Uint32Array(tam);
  crypto.getRandomValues(bytes);
  return [...bytes].map(b => alfabeto[b % alfabeto.length]).join("");
};

lib.megasena = () => {
  const s = new Set();
  while (s.size < 6) s.add(1 + Math.floor(Math.random() * 60));
  return [...s].sort((a, b) => a - b);
};

lib.rolarDado = (faces, qtd) => {
  const rolagens = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
  return { rolagens, total: rolagens.reduce((a, b) => a + b, 0) };
};

/* ---------- runner de testes ---------- */
const TESTES = [];

function assertEq(atual, esperado, msg) {
  const a = JSON.stringify(atual), e = JSON.stringify(esperado);
  if (a !== e) throw new Error((msg ? msg + ": " : "") + "esperado " + e + ", recebeu " + a);
}

function assertTrue(valor, msg) {
  if (!valor) throw new Error(msg || "esperado valor verdadeiro, recebeu " + JSON.stringify(valor));
}

function rodarTestes() {
  const falhas = [];
  let passou = 0;
  for (const t of TESTES) {
    try { t.fn(); passou++; }
    catch (e) { falhas.push({ nome: t.nome, erro: e.message }); }
  }
  return { passou, total: TESTES.length, falhas };
}

TESTES.push({ nome: "runner funciona", fn: () => assertEq(1 + 1, 2) });

TESTES.push({ nome: "toda ferramenta tem categoria válida", fn: () => {
  const ids = CATEGORIAS.map(c => c.id);
  for (const t of TOOLS) assertTrue(ids.includes(t.cat), t.id + " tem cat inválida: " + t.cat);
}});
TESTES.push({ nome: "ids de ferramenta são únicos", fn: () => {
  const vistos = new Set();
  for (const t of TOOLS) {
    assertTrue(!vistos.has(t.id), "id duplicado: " + t.id);
    vistos.add(t.id);
  }
}});
TESTES.push({ nome: "tipo é nativa, online ou script", fn: () => {
  for (const t of TOOLS) assertTrue(["nativa","online","script"].includes(t.tipo), t.id + " tipo inválido");
}});
TESTES.push({ nome: "getTool encontra e erra corretamente", fn: () => {
  assertEq(getTool("__nao_existe__"), undefined);
  if (TOOLS.length) assertEq(getTool(TOOLS[0].id).id, TOOLS[0].id);
}});
TESTES.push({ nome: "estado aberta da categoria respeita recolhidas e ativa", fn: () => {
  RECOLHIDAS.add("cat-x");
  assertEq(estadoAbertaCategoria("cat-x", 3, true), "sim", "ativa vence mesmo recolhida");
  RECOLHIDAS.delete("cat-x");
  assertEq(estadoAbertaCategoria("cat-y", 2, false), "sim", "com ferramentas e nao recolhida deve abrir");
  RECOLHIDAS.add("cat-y");
  assertEq(estadoAbertaCategoria("cat-y", 2, false), "nao", "recolhida deve fechar");
  RECOLHIDAS.delete("cat-y");
  assertEq(estadoAbertaCategoria("cat-z", 0, false), "nao", "sem ferramentas deve ficar fechada");
}});

TESTES.push({ nome: "store grava e lê JSON", fn: () => {
  try {
    store.gravar("omnia.__t", { a: 1 });
    assertEq(store.ler("omnia.__t", null), { a: 1 });
  } finally {
    localStorage.removeItem("omnia.__t");
  }
}});
TESTES.push({ nome: "store.ler devolve o padrão quando não existe", fn: () => {
  assertEq(store.ler("omnia.__nada", "pad"), "pad");
}});
TESTES.push({ nome: "recentes limita a 6 e não duplica", fn: () => {
  const bkp = store.ler("omnia.recentes", []);
  try {
    store.gravar("omnia.recentes", []);
    ["a","b","c","d","e","f","g"].forEach(store.registrarUso);
    assertEq(store.recentes(), ["g","f","e","d","c","b"]);
    store.registrarUso("d");
    assertEq(store.recentes(), ["d","g","f","e","c","b"]);
  } finally {
    store.gravar("omnia.recentes", bkp);
  }
}});
TESTES.push({ nome: "alternarFavorito adiciona e remove", fn: () => {
  const bkp = store.ler("omnia.favoritos", []);
  try {
    store.gravar("omnia.favoritos", []);
    assertEq(store.alternarFavorito("x"), ["x"]);
    assertEq(store.alternarFavorito("x"), []);
  } finally {
    store.gravar("omnia.favoritos", bkp);
  }
}});

TESTES.push({ nome: "ui.campo devolve input com wrapper e label", fn: () => {
  const c = ui.campo("Peso", "number");
  assertEq(c.tagName, "INPUT");
  assertEq(c.type, "number");
  assertTrue(c.wrapper.textContent.includes("Peso"));
}});
TESTES.push({ nome: "ui.saida.set preenche o conteúdo", fn: () => {
  const s = ui.saida(); s.set("abc");
  assertTrue(s.textContent.includes("abc"));
}});
TESTES.push({ nome: "ui.btn dispara o onClick", fn: () => {
  let n = 0;
  const b = ui.btn("ok", () => n++);
  b.click();
  assertEq(n, 1);
}});
TESTES.push({ nome: "ui.linha e ui.montar anexam .wrapper quando existe e o nó puro quando não", fn: () => {
  const campo1 = ui.campo("Nome");
  const botao1 = ui.btn("ok", () => {});
  const d = ui.linha(campo1, botao1);
  assertTrue(d.contains(campo1.wrapper), "linha deveria conter o wrapper do campo");
  assertTrue(d.querySelector("label") !== null, "wrapper com label deve estar presente na linha");
  assertTrue(d.contains(botao1), "linha deveria conter o botão puro (sem wrapper)");

  const el = document.createElement("div");
  const campo2 = ui.campo("Peso");
  const botao2 = ui.btn("ok", () => {});
  ui.montar(el, campo2, botao2);
  assertTrue(el.contains(campo2.wrapper), "montar deveria conter o wrapper do campo");
  assertTrue(el.querySelector("label") !== null, "wrapper com label deve estar presente em montar");
  assertTrue(el.contains(botao2), "montar deveria conter o botão puro (sem wrapper)");
}});
TESTES.push({ nome: "ui.saida alterna data-tem ao definir e limpar o texto", fn: () => {
  const s = ui.saida();
  assertEq(s.dataset.tem, "nao", "deve iniciar oculto");
  s.set("texto");
  assertEq(s.dataset.tem, "sim", "deve aparecer com conteúdo");
  s.set("");
  assertEq(s.dataset.tem, "nao", "deve ocultar quando vazio");
}});

TESTES.push({ nome: "normalizar remove acento e caixa", fn: () => {
  assertEq(lib.normalizar("Ação ÉPICA"), "acao epica");
}});
TESTES.push({ nome: "buscar acha por nome sem acento", fn: () => {
  const t = [{ id: "a", nome: "Números Romanos", desc: "", tags: [] }];
  assertEq(lib.buscar("numeros", t).length, 1);
  assertEq(lib.buscar("ROMAN", t).length, 1);
}});
TESTES.push({ nome: "buscar acha por tag e por desc", fn: () => {
  const t = [{ id: "a", nome: "Senha", desc: "gera chaves", tags: ["password"] }];
  assertEq(lib.buscar("password", t).length, 1);
  assertEq(lib.buscar("chaves", t).length, 1);
  assertEq(lib.buscar("xyz", t).length, 0);
}});
TESTES.push({ nome: "buscar com termo vazio devolve tudo", fn: () => {
  const t = [{ id: "a", nome: "A", desc: "", tags: [] }, { id: "b", nome: "B", desc: "", tags: [] }];
  assertEq(lib.buscar("  ", t).length, 2);
}});

TESTES.push({ nome: "inverter", fn: () => {
  assertEq(lib.inverter("abc"), "cba");
  assertEq(lib.inverter(""), "");
}});
TESTES.push({ nome: "caixa nos 5 modos", fn: () => {
  assertEq(lib.caixa("olá mundo", "maiuscula"), "OLÁ MUNDO");
  assertEq(lib.caixa("OLÁ MUNDO", "minuscula"), "olá mundo");
  assertEq(lib.caixa("olá mundo", "titulo"), "Olá Mundo");
  assertEq(lib.caixa("olá mundo. tudo bem", "frase"), "Olá mundo. Tudo bem");
  assertEq(lib.caixa("abcd", "alternada"), "AbCd");
}});
TESTES.push({ nome: "removerDuplicadas preserva a ordem", fn: () => {
  assertEq(lib.removerDuplicadas("a\nb\na\nc"), "a\nb\nc");
  assertEq(lib.removerDuplicadas("A\na"), "A\na");
  assertEq(lib.removerDuplicadas("A\na", true), "A");
}});
TESTES.push({ nome: "ordenar alfabeticamente com acento", fn: () => {
  assertEq(lib.ordenar("banana\nabacaxi\námora"), "abacaxi\námora\nbanana");
  assertEq(lib.ordenar("a\nb", true), "b\na");
}});
TESTES.push({ nome: "substituir literal e regex", fn: () => {
  assertEq(lib.substituir("a-b-c", "-", "+"), "a+b+c");
  assertEq(lib.substituir("a.b", ".", "!"), "a!b", "ponto é literal por padrão");
  assertEq(lib.substituir("a1b2", "\\d", "#", { regex: true }), "a#b#");
  assertEq(lib.substituir("Aa", "a", "x", { sensivel: true }), "Ax");
}});
TESTES.push({ nome: "contarTexto", fn: () => {
  const r = lib.contarTexto("Olá mundo\nsegunda linha");
  assertEq(r.caracteres, 23);
  assertEq(r.semEspacos, 20);
  assertEq(r.palavras, 4);
  assertEq(r.linhas, 2);
  assertEq(lib.contarTexto("").palavras, 0);
}});
TESTES.push({ nome: "sortear não repete e respeita o limite", fn: () => {
  const r = lib.sortear(["a","b","c"], 2);
  assertEq(r.length, 2);
  assertEq(new Set(r).size, 2);
  assertEq(lib.sortear(["a"], 5).length, 1);
}});
TESTES.push({ nome: "embaralhar preserva os elementos", fn: () => {
  const orig = [1,2,3,4,5];
  const r = lib.embaralhar(orig);
  assertEq(r.slice().sort(), [1,2,3,4,5]);
  assertEq(orig, [1,2,3,4,5], "não muta a entrada");
}});
TESTES.push({ nome: "gerarSenha respeita tamanho e conjuntos", fn: () => {
  const s = lib.gerarSenha({ tamanho: 24, maiusculas: true, minusculas: true, numeros: true, simbolos: true });
  assertEq(s.length, 24);
  assertTrue(/[A-Z]/.test(s) && /[a-z]/.test(s) && /\d/.test(s));
  const so = lib.gerarSenha({ tamanho: 10, numeros: true });
  assertTrue(/^\d{10}$/.test(so), "só números: " + so);
}});
TESTES.push({ nome: "megasena: 6 dezenas únicas de 1 a 60 em ordem", fn: () => {
  for (let i = 0; i < 50; i++) {
    const j = lib.megasena();
    assertEq(j.length, 6);
    assertEq(new Set(j).size, 6);
    assertTrue(j.every(n => n >= 1 && n <= 60));
    assertEq(j.slice().sort((a,b)=>a-b), j, "deve vir ordenado");
  }
}});
TESTES.push({ nome: "rolarDado soma e limita as faces", fn: () => {
  const r = lib.rolarDado(6, 3);
  assertEq(r.rolagens.length, 3);
  assertTrue(r.rolagens.every(n => n >= 1 && n <= 6));
  assertEq(r.total, r.rolagens.reduce((a,b)=>a+b,0));
}});

/* ---------- render provisório do runner ---------- */
function renderTestes(el) {
  const r = rodarTestes();
  const linhas = r.falhas.map(f =>
    '<li style="color:var(--erro)">✗ ' + f.nome + ' — ' + f.erro + '</li>'
  ).join("");
  el.innerHTML =
    '<h1>Testes: ' + r.passou + '/' + r.total + '</h1>' +
    (r.falhas.length ? '<ul>' + linhas + '</ul>' : '<p style="color:var(--ok)">Todos passaram.</p>');
}

/* ---------- categorias ---------- */
const CATEGORIAS = [
  { id: "texto",     nome: "Manipulação de Texto",  icone: "📝" },
  { id: "analise",   nome: "Análise de Texto",      icone: "🔍" },
  { id: "org",       nome: "Armazenamento",         icone: "🗂️" },
  { id: "aleatorio", nome: "Aleatório",             icone: "🎲" },
  { id: "cripto",    nome: "Criptografia",          icone: "🔐" },
  { id: "data",      nome: "Data e Hora",           icone: "📅" },

/* ---------- persistência ---------- */
const store = {
  ler(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v === null ? padrao : JSON.parse(v);
    } catch (e) { return padrao; }
  },
  gravar(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
  },
  favoritos() { return store.ler("omnia.favoritos", []); },
  alternarFavorito(id) {
    const f = store.favoritos();
    const i = f.indexOf(id);
    if (i >= 0) f.splice(i, 1); else f.push(id);
    store.gravar("omnia.favoritos", f);
    return f;
  },
  recentes() { return store.ler("omnia.recentes", []); },
  registrarUso(id) {
    const r = store.recentes().filter(x => x !== id);
    r.unshift(id);
    store.gravar("omnia.recentes", r.slice(0, 6));
  }
};

/* ---------- ui kit ---------- */
const ui = {
  _campo(label, node) {
    const w = document.createElement("div");
    w.className = "campo";
    const l = document.createElement("label");
    l.textContent = label;
    w.appendChild(l); w.appendChild(node);
    node.wrapper = w;
    return node;
  },
  campo(label, tipo = "text", attrs = {}) {
    const i = document.createElement("input");
    i.type = tipo;
    Object.assign(i, attrs);
    return ui._campo(label, i);
  },
  area(label, attrs = {}) {
    const t = document.createElement("textarea");
    Object.assign(t, attrs);
    return ui._campo(label, t);
  },
  select(label, opcoes) {
    const s = document.createElement("select");
    s.innerHTML = opcoes.map(o => '<option value="' + o.v + '">' + o.t + '</option>').join("");
    return ui._campo(label, s);
  },
  btn(texto, onClick, variante = "primaria") {
    const b = document.createElement("button");
    b.className = "btn" + (variante === "primaria" ? "" : " " + variante);
    b.textContent = texto;
    b.onclick = onClick;
    return b;
  },
  saida() {
    const d = document.createElement("div");
    d.className = "saida";
    const pre = document.createElement("span");
    const cp = document.createElement("button");
    cp.className = "copiar"; cp.textContent = "copiar";
    cp.onclick = () => ui.copiar(pre.textContent);
    d.appendChild(cp); d.appendChild(pre);
    d.set = txt => {
      pre.textContent = txt;
      d.dataset.tem = txt ? "sim" : "nao";
    };
    d.set("");
    return d;
  },
  copiar(texto) {
    const fim = () => ui.toast("Copiado!");
    if (navigator.clipboard && location.protocol !== "file:") {
      navigator.clipboard.writeText(texto).then(fim, () => ui._copiaLegada(texto, fim));
    } else {
      ui._copiaLegada(texto, fim);
    }
  },
  _copiaLegada(texto, fim) {
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try {
      const ok = document.execCommand("copy");
      if (ok) fim(); else ui.toast("Não foi possível copiar");
    }
    catch (e) { ui.toast("Não foi possível copiar"); }
    ta.remove();
  },
  toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.dataset.ver = "sim";
    clearTimeout(ui._tt);
    ui._tt = setTimeout(() => (t.dataset.ver = "nao"), 1800);
  },
  linha(...nos) {
    const d = document.createElement("div");
    d.className = "linha";
    nos.forEach(n => d.appendChild(n.wrapper || n));
    return d;
  },
  montar(el, ...nos) {
    nos.forEach(n => el.appendChild(n.wrapper || n));
  }
};

/* ---------- sidebar ---------- */
const SELOS = { nativa: "🟢", online: "🔵", script: "🟡" };

const RECOLHIDAS = new Set();

function estadoAbertaCategoria(catId, qtdFerramentas, temAtiva) {
  if (temAtiva) return "sim";
  if (!qtdFerramentas) return "nao";
  return RECOLHIDAS.has(catId) ? "nao" : "sim";
}

function renderSidebar() {
  const ativa = (location.hash.match(/^#\/([\w-]+)/) || [])[1];
  const favs = store.favoritos().map(getTool).filter(Boolean);
  const blocoFav = favs.length
    ? '<div class="cat" data-aberta="sim"><button>⭐ Favoritos</button><ul>' +
      favs.map(t => '<li><a href="#/' + t.id + '">' + SELOS[t.tipo] + ' ' + t.nome + '</a></li>').join("") +
      '</ul></div>'
    : "";
  document.getElementById("lista-cats").innerHTML = blocoFav + CATEGORIAS.map(c => {
    const ts = TOOLS.filter(t => t.cat === c.id);
    const itens = ts.length
      ? ts.map(t => '<li><a href="#/' + t.id + '"' +
          (t.id === ativa ? ' data-ativa="sim"' : '') + '>' +
          SELOS[t.tipo] + ' ' + t.nome + '</a></li>').join("")
      : '<li class="vazia">em breve</li>';
    const aberta = estadoAbertaCategoria(c.id, ts.length, ts.some(t => t.id === ativa));
    return '<div class="cat" data-cat="' + c.id + '" data-aberta="' + aberta + '">' +
      '<button>' + c.icone + ' ' + c.nome + '<span>' + (ts.length || "") + '</span></button>' +
      '<ul>' + itens + '</ul></div>';
  }).join("");

  document.querySelectorAll(".cat > button").forEach(b => {
    b.onclick = () => {
      const cat = b.parentElement;
      const novo = cat.dataset.aberta === "sim" ? "nao" : "sim";
      cat.dataset.aberta = novo;
      if (novo === "nao") RECOLHIDAS.add(cat.dataset.cat);
      else RECOLHIDAS.delete(cat.dataset.cat);
    };
  });
}

/* ---------- router ---------- */
function navegar() {
  document.getElementById("busca").value = "";
  const main = document.getElementById("main");
  main.innerHTML = "";
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1];

  if (id === "_testes") { renderSidebar(); renderTestes(main); return; }

  const tool = id && getTool(id);
  if (tool) {
    const cat = CATEGORIAS.find(c => c.id === tool.cat);
    const cab = document.createElement("div");
    cab.innerHTML = '<h1 style="margin:0 0 4px;font-size:24px">' + tool.nome + '</h1>' +
      '<p style="margin:0 0 20px;color:var(--texto-fraco)">' +
      SELOS[tool.tipo] + ' ' + cat.nome + ' — ' + tool.desc + '</p>';
    main.appendChild(cab);
    store.registrarUso(tool.id);
    const fav = ui.btn(
      store.favoritos().includes(tool.id) ? "★ Favorita" : "☆ Favoritar",
      e => { store.alternarFavorito(tool.id); navegar(); },
      "secundaria"
    );
    cab.appendChild(fav);
    const caixa = document.createElement("div");
    main.appendChild(caixa);
    tool.render(caixa);
  } else {
    renderHome(main);
  }
  renderSidebar();
  document.getElementById("sidebar").dataset.aberta = "nao";
  document.getElementById("overlay").dataset.aberta = "nao";
  window.scrollTo(0, 0);
}

function renderHome(el) {
  const recentes = store.recentes().map(getTool).filter(Boolean);
  const cards = CATEGORIAS.map(c => {
    const n = TOOLS.filter(t => t.cat === c.id).length;
    return '<div class="card-cat"><div class="ic">' + c.icone + '</div>' +
      '<strong>' + c.nome + '</strong>' +
      '<span>' + (n ? n + (n > 1 ? " ferramentas" : " ferramenta") : "em breve") + '</span></div>';
  }).join("");
  el.innerHTML =
    '<h1 style="margin:0 0 6px">Omn<span style="color:var(--acento)">IA</span></h1>' +
    '<p style="color:var(--texto-fraco);margin:0 0 24px">' +
    TOOLS.length + ' ferramentas prontas para usar. Tudo roda no seu navegador.</p>' +
    (recentes.length
      ? '<h2 style="font-size:15px;color:var(--texto-fraco)">Usadas recentemente</h2><div class="grade">' +
        recentes.map(t => '<a class="card" href="#/' + t.id + '">' + SELOS[t.tipo] + ' ' + t.nome + '</a>').join("") +
        '</div>'
      : '') +
    '<h2 style="font-size:15px;color:var(--texto-fraco);margin-top:26px">Categorias</h2>' +
    '<div class="grade-cats">' + cards + '</div>';
}

/* ---------- busca ---------- */
const inputBusca = document.getElementById("busca");
inputBusca.addEventListener("input", () => {
  const q = inputBusca.value;
  if (!q.trim()) { navegar(); return; }
  const achados = lib.buscar(q, TOOLS);
  document.getElementById("main").innerHTML =
    '<h1 style="font-size:20px">Busca: "' + q.replace(/</g, "&lt;") + '"</h1>' +
    (achados.length
      ? '<div class="grade">' + achados.map(t =>
          '<a class="card" href="#/' + t.id + '">' + SELOS[t.tipo] + ' ' + t.nome +
          '<span>' + t.desc + '</span></a>').join("") + '</div>'
      : '<p>Nenhuma ferramenta encontrada.</p>');
});
inputBusca.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const achados = lib.buscar(inputBusca.value, TOOLS);
  if (achados.length) { inputBusca.value = ""; location.hash = "#/" + achados[0].id; }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); inputBusca.focus(); }
});

function aplicarTema(tema) {
  document.documentElement.dataset.tema = tema;
  document.getElementById("btn-tema").textContent = tema === "dark" ? "🌙" : "☀️";
  store.gravar("omnia.tema", tema);
}
aplicarTema(store.ler("omnia.tema", "dark"));
document.getElementById("btn-tema").onclick = () =>
  aplicarTema(document.documentElement.dataset.tema === "dark" ? "light" : "dark");

window.addEventListener("hashchange", navegar);
document.getElementById("btn-menu").onclick = () => {
  const s = document.getElementById("sidebar"), o = document.getElementById("overlay");
  const novo = s.dataset.aberta === "sim" ? "nao" : "sim";
  s.dataset.aberta = novo; o.dataset.aberta = novo;
};
document.getElementById("overlay").onclick = () => {
  document.getElementById("sidebar").dataset.aberta = "nao";
  document.getElementById("overlay").dataset.aberta = "nao";
};
navegar();
</script>
