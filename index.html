<!doctype html>
<html lang="pt-BR" data-tema="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmnIA — Canivete Suíço Digital</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1c2430;
  --borda: #2a3441; --texto: #e6edf3; --texto-fraco: #8b949e;
  --acento: #22d3ee; --acento-2: #a78bfa;
  --ok: #4ade80; --erro: #f87171;
  --overlay: rgba(0, 0, 0, .5);
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --r: 10px;
}
[data-tema="light"] {
  --bg: #f6f8fa; --surface: #ffffff; --surface-2: #eef2f6;
  --borda: #d6dee6; --texto: #1f2933; --texto-fraco: #5b6b7c;
  --acento: #0891b2; --acento-2: #7c3aed;
  --ok: #15803d; --erro: #b91c1c;
  --overlay: rgba(15, 23, 32, .35);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--texto);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  overflow-x: hidden;
}
header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--borda);
}
.logo { font-weight: 700; letter-spacing: -.4px; white-space: nowrap; }
.logo span { color: var(--acento); }
#busca {
  flex: 1; max-width: 520px; height: 36px; padding: 0 12px;
  background: var(--bg); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r); outline: none;
}
#busca:focus { border-color: var(--acento); }
.icone-btn {
  height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r);
}
.icone-btn:hover { border-color: var(--acento); }
#btn-menu { display: none; }

.wrap { display: flex; align-items: flex-start; }
#sidebar {
  position: sticky; top: 58px; flex: 0 0 260px; width: 260px;
  height: calc(100vh - 58px); overflow-y: auto; padding: 12px;
  background: var(--surface); border-right: 1px solid var(--borda);
}
#main { flex: 1; min-width: 0; padding: 24px; max-width: 900px; }

.cat > button {
  display: flex; justify-content: space-between; width: 100%; padding: 8px 10px;
  cursor: pointer; text-align: left; font-size: 13px; font-weight: 600;
  color: var(--texto-fraco); background: none; border: 0; border-radius: 8px;
}
.cat > button:hover { background: var(--surface-2); color: var(--texto); }
.cat ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 10px; }
.cat[data-aberta="nao"] ul { display: none; }
.cat a {
  display: block; padding: 6px 10px; border-radius: 8px;
  color: var(--texto); text-decoration: none; font-size: 14px;
}
.cat a:hover { background: var(--surface-2); }
.cat a[data-ativa="sim"] { background: var(--surface-2); color: var(--acento); }
.vazia { padding: 6px 10px; font-size: 13px; color: var(--texto-fraco); font-style: italic; }

.campo { margin-bottom: 14px; }
.campo label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--texto-fraco); }
.campo input, .campo textarea, .campo select {
  width: 100%; padding: 9px 11px; font: inherit;
  background: var(--surface); color: var(--texto);
  border: 1px solid var(--borda); border-radius: var(--r); outline: none;
}
.campo textarea { min-height: 130px; resize: vertical; font-family: var(--mono); font-size: 13px; }
.campo input:focus, .campo textarea:focus, .campo select:focus { border-color: var(--acento); }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.linha > .campo { flex: 1 1 160px; margin-bottom: 14px; }
.btn {
  padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  border: 1px solid transparent; border-radius: var(--r);
  background: var(--acento); color: #06222a;
}
.btn:hover { filter: brightness(1.1); }
.btn.secundaria { background: var(--surface-2); color: var(--texto); border-color: var(--borda); }
.saida {
  position: relative; margin-top: 16px; padding: 14px; min-height: 46px;
  background: var(--surface); border: 1px solid var(--borda); border-radius: var(--r);
  font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word;
  overflow-x: auto;
}
.saida .copiar {
  position: absolute; top: 8px; right: 8px; display: none;
  padding: 4px 9px; font-size: 12px; cursor: pointer;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--borda); border-radius: 7px;
}
.saida[data-tem="sim"] .copiar { display: block; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  padding: 10px 18px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
  background: var(--surface-2); color: var(--texto);
  border: 1px solid var(--acento); border-radius: var(--r);
}
#toast[data-ver="sim"] { opacity: 1; }

#overlay { display: none; }
@media (max-width: 767px) {
  #btn-menu { display: block; }
  #main { padding: 16px; }
  #sidebar {
    position: fixed; top: 58px; left: 0; z-index: 25;
    transform: translateX(-100%); transition: transform .2s;
  }
  #sidebar[data-aberta="sim"] { transform: none; }
  #overlay[data-aberta="sim"] {
    display: block; position: fixed; inset: 58px 0 0; z-index: 20;
    background: var(--overlay);
  }
}
</style>
</head>
<body>
<header>
  <button class="icone-btn" id="btn-menu" aria-label="Menu">☰</button>
  <div class="logo">Omn<span>IA</span></div>
  <input id="busca" type="search" placeholder="Buscar ferramenta…  (Ctrl+K)" autocomplete="off">
  <button class="icone-btn" id="btn-tema" aria-label="Alternar tema">🌙</button>
</header>
<div class="wrap">
  <nav id="sidebar"><div id="lista-cats"></div></nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
"use strict";
const OmnIA = { lib: {} };
const lib = OmnIA.lib;

/* ---------- runner de testes ---------- */
const TESTES = [];

function assertEq(atual, esperado, msg) {
  const a = JSON.stringify(atual), e = JSON.stringify(esperado);
  if (a !== e) throw new Error((msg ? msg + ": " : "") + "esperado " + e + ", recebeu " + a);
}

function assertTrue(valor, msg) {
  if (!valor) throw new Error(msg || "esperado valor verdadeiro, recebeu " + JSON.stringify(valor));
}

function rodarTestes() {
  const falhas = [];
  let passou = 0;
  for (const t of TESTES) {
    try { t.fn(); passou++; }
    catch (e) { falhas.push({ nome: t.nome, erro: e.message }); }
  }
  return { passou, total: TESTES.length, falhas };
}

TESTES.push({ nome: "runner funciona", fn: () => assertEq(1 + 1, 2) });

TESTES.push({ nome: "toda ferramenta tem categoria válida", fn: () => {
  const ids = CATEGORIAS.map(c => c.id);
  for (const t of TOOLS) assertTrue(ids.includes(t.cat), t.id + " tem cat inválida: " + t.cat);
}});
TESTES.push({ nome: "ids de ferramenta são únicos", fn: () => {
  const vistos = new Set();
  for (const t of TOOLS) {
    assertTrue(!vistos.has(t.id), "id duplicado: " + t.id);
    vistos.add(t.id);
  }
}});
TESTES.push({ nome: "tipo é nativa, online ou script", fn: () => {
  for (const t of TOOLS) assertTrue(["nativa","online","script"].includes(t.tipo), t.id + " tipo inválido");
}});
TESTES.push({ nome: "getTool encontra e erra corretamente", fn: () => {
  assertEq(getTool("__nao_existe__"), undefined);
  if (TOOLS.length) assertEq(getTool(TOOLS[0].id).id, TOOLS[0].id);
}});
TESTES.push({ nome: "estado aberta da categoria respeita recolhidas e ativa", fn: () => {
  RECOLHIDAS.add("cat-x");
  assertEq(estadoAbertaCategoria("cat-x", 3, true), "sim", "ativa vence mesmo recolhida");
  RECOLHIDAS.delete("cat-x");
  assertEq(estadoAbertaCategoria("cat-y", 2, false), "sim", "com ferramentas e nao recolhida deve abrir");
  RECOLHIDAS.add("cat-y");
  assertEq(estadoAbertaCategoria("cat-y", 2, false), "nao", "recolhida deve fechar");
  RECOLHIDAS.delete("cat-y");
  assertEq(estadoAbertaCategoria("cat-z", 0, false), "nao", "sem ferramentas deve ficar fechada");
}});

TESTES.push({ nome: "ui.campo devolve input com wrapper e label", fn: () => {
  const c = ui.campo("Peso", "number");
  assertEq(c.tagName, "INPUT");
  assertEq(c.type, "number");
  assertTrue(c.wrapper.textContent.includes("Peso"));
}});
TESTES.push({ nome: "ui.saida.set preenche o conteúdo", fn: () => {
  const s = ui.saida(); s.set("abc");
  assertTrue(s.textContent.includes("abc"));
}});
TESTES.push({ nome: "ui.btn dispara o onClick", fn: () => {
  let n = 0;
  const b = ui.btn("ok", () => n++);
  b.click();
  assertEq(n, 1);
}});

/* ---------- render provisório do runner ---------- */
function renderTestes(el) {
  const r = rodarTestes();
  const linhas = r.falhas.map(f =>
    '<li style="color:var(--erro)">✗ ' + f.nome + ' — ' + f.erro + '</li>'
  ).join("");
  el.innerHTML =
    '<h1>Testes: ' + r.passou + '/' + r.total + '</h1>' +
    (r.falhas.length ? '<ul>' + linhas + '</ul>' : '<p style="color:var(--ok)">Todos passaram.</p>');
}

/* ---------- categorias ---------- */
const CATEGORIAS = [
  { id: "texto",     nome: "Manipulação de Texto",  icone: "📝" },
  { id: "analise",   nome: "Análise de Texto",      icone: "🔍" },
  { id: "org",       nome: "Armazenamento",         icone: "🗂️" },
  { id: "aleatorio", nome: "Aleatório",             icone: "🎲" },
  { id: "cripto",    nome: "Criptografia",          icone: "🔐" },
  { id: "data",      nome: "Data e Hora",           icone: "📅" },
  { id: "mat",       nome: "Números e Matemática",  icone: "🔢" },
  { id: "financas",  nome: "Finanças",              icone: "💰" },
  { id: "dev",       nome: "Desenvolvedor",         icone: "👨‍💻" },
  { id: "rede",      nome: "Internet e Redes",      icone: "🌐" },
  { id: "midia",     nome: "Multimídia e Imagem",   icone: "🖼️" },
  { id: "saude",     nome: "Saúde e Biologia",      icone: "❤️" },
  { id: "docs",      nome: "Documentos e Dados",    icone: "📄" },
  { id: "diversos",  nome: "Símbolos e Diversos",   icone: "✨" }
];

/* ---------- ui kit ---------- */
const ui = {
  _campo(label, node) {
    const w = document.createElement("div");
    w.className = "campo";
    const l = document.createElement("label");
    l.textContent = label;
    w.appendChild(l); w.appendChild(node);
    node.wrapper = w;
    return node;
  },
  campo(label, tipo = "text", attrs = {}) {
    const i = document.createElement("input");
    i.type = tipo;
    Object.assign(i, attrs);
    return ui._campo(label, i);
  },
  area(label, attrs = {}) {
    const t = document.createElement("textarea");
    Object.assign(t, attrs);
    return ui._campo(label, t);
  },
  select(label, opcoes) {
    const s = document.createElement("select");
    s.innerHTML = opcoes.map(o => '<option value="' + o.v + '">' + o.t + '</option>').join("");
    return ui._campo(label, s);
  },
  btn(texto, onClick, variante = "primaria") {
    const b = document.createElement("button");
    b.className = "btn" + (variante === "primaria" ? "" : " " + variante);
    b.textContent = texto;
    b.onclick = onClick;
    return b;
  },
  saida() {
    const d = document.createElement("div");
    d.className = "saida";
    const pre = document.createElement("span");
    const cp = document.createElement("button");
    cp.className = "copiar"; cp.textContent = "copiar";
    cp.onclick = () => ui.copiar(pre.textContent);
    d.appendChild(cp); d.appendChild(pre);
    d.set = txt => {
      pre.textContent = txt;
      d.dataset.tem = txt ? "sim" : "nao";
    };
    d.set("");
    return d;
  },
  copiar(texto) {
    const fim = () => ui.toast("Copiado!");
    if (navigator.clipboard && location.protocol !== "file:") {
      navigator.clipboard.writeText(texto).then(fim, () => ui._copiaLegada(texto, fim));
    } else {
      ui._copiaLegada(texto, fim);
    }
  },
  _copiaLegada(texto, fim) {
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); fim(); }
    catch (e) { ui.toast("Não foi possível copiar"); }
    ta.remove();
  },
  toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.dataset.ver = "sim";
    clearTimeout(ui._tt);
    ui._tt = setTimeout(() => (t.dataset.ver = "nao"), 1800);
  },
  linha(...nos) {
    const d = document.createElement("div");
    d.className = "linha";
    nos.forEach(n => d.appendChild(n.wrapper || n));
    return d;
  },
  montar(el, ...nos) {
    nos.forEach(n => el.appendChild(n.wrapper || n));
  }
};

/* ---------- registry ---------- */
const TOOLS = [];
const getTool = id => TOOLS.find(t => t.id === id);

/* ---------- sidebar ---------- */
const SELOS = { nativa: "🟢", online: "🔵", script: "🟡" };

const RECOLHIDAS = new Set();

function estadoAbertaCategoria(catId, qtdFerramentas, temAtiva) {
  if (temAtiva) return "sim";
  if (!qtdFerramentas) return "nao";
  return RECOLHIDAS.has(catId) ? "nao" : "sim";
}

function renderSidebar() {
  const ativa = (location.hash.match(/^#\/([\w-]+)/) || [])[1];
  document.getElementById("lista-cats").innerHTML = CATEGORIAS.map(c => {
    const ts = TOOLS.filter(t => t.cat === c.id);
    const itens = ts.length
      ? ts.map(t => '<li><a href="#/' + t.id + '"' +
          (t.id === ativa ? ' data-ativa="sim"' : '') + '>' +
          SELOS[t.tipo] + ' ' + t.nome + '</a></li>').join("")
      : '<li class="vazia">em breve</li>';
    const aberta = estadoAbertaCategoria(c.id, ts.length, ts.some(t => t.id === ativa));
    return '<div class="cat" data-cat="' + c.id + '" data-aberta="' + aberta + '">' +
      '<button>' + c.icone + ' ' + c.nome + '<span>' + (ts.length || "") + '</span></button>' +
      '<ul>' + itens + '</ul></div>';
  }).join("");

  document.querySelectorAll(".cat > button").forEach(b => {
    b.onclick = () => {
      const cat = b.parentElement;
      const novo = cat.dataset.aberta === "sim" ? "nao" : "sim";
      cat.dataset.aberta = novo;
      if (novo === "nao") RECOLHIDAS.add(cat.dataset.cat);
      else RECOLHIDAS.delete(cat.dataset.cat);
    };
  });
}

/* ---------- router ---------- */
function navegar() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1];

  if (id === "_testes") { renderSidebar(); renderTestes(main); return; }

  const tool = id && getTool(id);
  if (tool) {
    const cat = CATEGORIAS.find(c => c.id === tool.cat);
    const cab = document.createElement("div");
    cab.innerHTML = '<h1 style="margin:0 0 4px;font-size:24px">' + tool.nome + '</h1>' +
      '<p style="margin:0 0 20px;color:var(--texto-fraco)">' +
      SELOS[tool.tipo] + ' ' + cat.nome + ' — ' + tool.desc + '</p>';
    main.appendChild(cab);
    const caixa = document.createElement("div");
    main.appendChild(caixa);
    tool.render(caixa);
  } else {
    renderHome(main);
  }
  renderSidebar();
  document.getElementById("sidebar").dataset.aberta = "nao";
  document.getElementById("overlay").dataset.aberta = "nao";
  window.scrollTo(0, 0);
}

function renderHome(el) {
  el.innerHTML = '<h1>OmnIA</h1><p>Escolha uma ferramenta na barra lateral.</p>';
}

window.addEventListener("hashchange", navegar);
document.getElementById("btn-menu").onclick = () => {
  const s = document.getElementById("sidebar"), o = document.getElementById("overlay");
  const novo = s.dataset.aberta === "sim" ? "nao" : "sim";
  s.dataset.aberta = novo; o.dataset.aberta = novo;
};
document.getElementById("overlay").onclick = () => {
  document.getElementById("sidebar").dataset.aberta = "nao";
  document.getElementById("overlay").dataset.aberta = "nao";
};
navegar();
</script>
</body>
</html>
